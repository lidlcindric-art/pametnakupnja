[package]
name = "pk-ingest"
version = "0.1.0"
edition = "2021"
description = "PametnaKupnja: uvoz cijena (cijene.dev arhiva) i recepata (coolinarika.com) u D1 SQL"
license = "MIT"

[[bin]]
name = "pk-ingest"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
