# Katalog namirnica za PametnaKupnja
#
# Svaka stavka je "kataloška" namirnica (npr. "Mlijeko 1 l") koju korisnik bira.
# Ingest za svaki trgovački lanac pronalazi najjeftinije proizvode koji odgovaraju pravilima.
#
# Sva pravila (regex) primjenjuju se na naziv proizvoda koji je:
#   - pretvoren u mala slova
#   - bez dijakritika (č,ć->c, š->s, ž->z, đ->d)
#
# Polja:
#   slug, name, category    – identifikacija i prikaz
#   unit                    – "kg" (kg ili l, gustoća ~1), "kom" (komadi) ili "any" (bez provjere veličine)
#   target                  – koliko je potrebno (u jedinici); trošak = ceil(target / veličina_pakiranja) × cijena
#   min, max                – dopušteni raspon veličine jednog pakiranja
#   include / exclude       – regex na nazivu proizvoda
#   recipe / recipe_exclude – regex na retku sastojka iz recepta (najduže podudaranje pobjeđuje)

# Globalni filtri (primjenjuju se na sve stavke):
#   global_exclude   – regex na nazivu proizvoda: nikad nije namirnica
#   category_exclude – regex na kategoriji proizvoda iz lanca (npr. KOZMETIKA)
global_exclude = 'noodles|\bokus\b|\bpripr|\bproof\b|\bploc\.|cafemio|morske skoljke|\brolice\b|kitekat|wise cat|pedigre|sheba|gourmet|perfect fit|purina|\bcat\b|\bdog\b|\bpas\b|\bpsi\b|macka|macke|friskies|whiskas|felix|pedigree|\bpet\.|\bl\.pet|buddy|harmon|navlak|\bzlica|\bcetk|\bigr\.|zica za|deterg|\bhrana\b|vilmorin|\bsjeme\b|\bsjemen|naljepnic|\btorb|\bvrec(a|e|ica|ice)?\b|\bvrec\.|cjedil|posipac|rezac|\bnoz\b|pladanj|biljeznic|svrdl|tanjur|podmetac|loncanic|salvet|ukrasn|lampic|etiket|sampon|\bkupk|svijec|igrack|boca za|staklenk|poklopac|pritiskiv|gnjecil|cetkic|\bzub|rukav|posud|hrana za|za (pse|macke|pasa)\b|\bmacj|\bpasj|\bk-9\b|kalup|\bsprej|osvjezivac|deterdzent|omeksiv|\bset za\b|cracker|vezice|\bpick\b|ratluk|\bbom\.|bombon|magnet|cestitk|figur|dekoracij|folij|\bcips|chips|smoothie|limunad|gaz\. pice|\bsodo\b|bitter lemon|mocktail|spritz|siljil|olovk|\bol\.|\bsg\b|balea|\bkrem za\b'
category_exclude = 'kozmet|ciscenj|kucanstv|toaletn|neprehran|^ostalo'

